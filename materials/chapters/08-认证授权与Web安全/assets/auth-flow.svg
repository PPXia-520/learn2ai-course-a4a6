<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='960' height='470' role='img' aria-label='登录与鉴权流程图'>
  <rect width='960' height='470' fill='#f8fafc'/>
  <g font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>
    <text x='40' y='46' font-size='22' font-weight='700' fill='#0f172a'>登录、鉴权、刷新与撤销</text>

    <rect x='40' y='80' width='200' height='80' rx='10' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/>
    <text x='140' y='112' text-anchor='middle' font-size='15' font-weight='700' fill='#1d4ed8'>① 注册 / 登录</text>
    <text x='140' y='138' text-anchor='middle' font-size='12' fill='#334155'>bcrypt 校验密码哈希</text>

    <rect x='290' y='80' width='200' height='80' rx='10' fill='#f5f3ff' stroke='#7c3aed' stroke-width='2'/>
    <text x='390' y='112' text-anchor='middle' font-size='15' font-weight='700' fill='#6d28d9'>② 签发令牌</text>
    <text x='390' y='138' text-anchor='middle' font-size='12' fill='#334155'>access 15m ／ refresh 7d</text>

    <rect x='540' y='80' width='200' height='80' rx='10' fill='#ecfdf5' stroke='#059669' stroke-width='2'/>
    <text x='640' y='112' text-anchor='middle' font-size='15' font-weight='700' fill='#047857'>③ 携带令牌请求</text>
    <text x='640' y='138' text-anchor='middle' font-size='12' fill='#334155'>Authorization: Bearer</text>

    <rect x='790' y='80' width='130' height='80' rx='10' fill='#0f172a'/>
    <text x='855' y='112' text-anchor='middle' font-size='14' font-weight='700' fill='#ffffff'>④ 校验</text>
    <text x='855' y='138' text-anchor='middle' font-size='11' fill='#cbd5e1'>签名 / 过期 / 权限</text>

    <path d='M244 120 L286 120' stroke='#94a3b8' stroke-width='2'/>
    <path d='M494 120 L536 120' stroke='#94a3b8' stroke-width='2'/>
    <path d='M744 120 L786 120' stroke='#94a3b8' stroke-width='2'/>

    <rect x='40' y='196' width='420' height='110' rx='10' fill='#ffffff' stroke='#059669'/>
    <text x='60' y='224' font-size='15' font-weight='700' fill='#047857'>校验通过</text>
    <text x='60' y='250' font-size='13' fill='#334155'>令牌有效 → 继续业务处理</text>
    <text x='60' y='276' font-size='13' fill='#334155'>再校验资源归属（防水平越权）</text>
    <text x='60' y='298' font-size='12' fill='#64748b'>401 只表示身份未知；403 表示身份已知但无权限</text>

    <rect x='500' y='196' width='420' height='110' rx='10' fill='#ffffff' stroke='#e11d48'/>
    <text x='520' y='224' font-size='15' font-weight='700' fill='#be123c'>校验失败</text>
    <text x='520' y='250' font-size='13' fill='#334155'>无令牌 / 伪造 → 401 INVALID_TOKEN</text>
    <text x='520' y='276' font-size='13' fill='#334155'>过期 → 401 TOKEN_EXPIRED → 用 refresh 换新</text>
    <text x='520' y='298' font-size='13' fill='#334155'>权限不足 → 403 FORBIDDEN</text>

    <rect x='40' y='330' width='880' height='110' rx='10' fill='#fffbeb' stroke='#d97706'/>
    <text x='60' y='358' font-size='15' font-weight='700' fill='#b45309'>⑤ 刷新与撤销（决定会话是否真正可控）</text>
    <text x='60' y='384' font-size='13' fill='#334155'>刷新：用 refresh 换新 access，且 refresh 轮换——旧 refresh 立即作废</text>
    <text x='60' y='410' font-size='13' fill='#334155'>登出：服务端删除 refresh 记录（JWT 无状态，撤销必须靠服务端存储）</text>
    <text x='60' y='432' font-size='12' fill='#64748b'>安全属性：Cookie 加 HttpOnly + Secure + SameSite；access token 越短越安全</text>
  </g>
</svg>