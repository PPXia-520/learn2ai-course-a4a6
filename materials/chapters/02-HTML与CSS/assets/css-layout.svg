<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 500' width='960' height='500' role='img' aria-label='CSS 盒模型与 Flexbox、Grid 布局对照图'>
  <rect width='960' height='500' fill='#f8fafc'/>
  <g font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>
    <text x='40' y='46' font-size='22' font-weight='700' fill='#0f172a'>盒模型与两种布局模型</text>

    <rect x='40' y='86' width='340' height='250' rx='8' fill='#f8fafc' stroke='#cbd5e1' stroke-width='2'/>
    <text x='54' y='108' font-size='13' font-weight='700' fill='#64748b'>margin</text>
    <rect x='62' y='118' width='296' height='196' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
    <text x='76' y='140' font-size='13' font-weight='700' fill='#b45309'>border</text>
    <rect x='92' y='150' width='236' height='136' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/>
    <text x='106' y='172' font-size='13' font-weight='700' fill='#15803d'>padding</text>
    <rect x='122' y='182' width='176' height='76' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
    <text x='210' y='226' text-anchor='middle' font-size='14' font-weight='700' fill='#1d4ed8'>content</text>

    <text x='40' y='366' font-size='13' fill='#475569'>box-sizing: content-box → width 只算内容</text>
    <text x='40' y='390' font-size='13' font-weight='700' fill='#1d4ed8'>box-sizing: border-box → width 含 padding 与 border（推荐）</text>
    <text x='40' y='424' font-size='13' fill='#475569'>全局设置：*, *::before, *::after { box-sizing: border-box; }</text>

    <text x='420' y='108' font-size='18' font-weight='700' fill='#1d4ed8'>Flexbox · 一维布局</text>
    <rect x='420' y='122' width='500' height='80' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/>
    <rect x='440' y='140' width='110' height='44' rx='6' fill='#bfdbfe' stroke='#2563eb'/>
    <rect x='615' y='140' width='110' height='44' rx='6' fill='#bfdbfe' stroke='#2563eb'/>
    <rect x='790' y='140' width='110' height='44' rx='6' fill='#bfdbfe' stroke='#2563eb'/>
    <text x='495' y='167' text-anchor='middle' font-size='12' fill='#1e40af'>item</text>
    <text x='670' y='167' text-anchor='middle' font-size='12' fill='#1e40af'>item</text>
    <text x='845' y='167' text-anchor='middle' font-size='12' fill='#1e40af'>item</text>
    <text x='420' y='222' font-size='13' fill='#475569'>justify-content: space-between · align-items: center · gap</text>
    <text x='420' y='244' font-size='13' fill='#475569'>适用：工具栏、按钮组、行内排列对齐</text>

    <text x='420' y='298' font-size='18' font-weight='700' fill='#6d28d9'>Grid · 二维布局</text>
    <rect x='420' y='312' width='500' height='140' rx='8' fill='#f5f3ff' stroke='#7c3aed' stroke-width='2'/>
    <rect x='440' y='330' width='140' height='46' rx='6' fill='#ddd6fe' stroke='#7c3aed'/>
    <rect x='600' y='330' width='140' height='46' rx='6' fill='#ddd6fe' stroke='#7c3aed'/>
    <rect x='760' y='330' width='140' height='46' rx='6' fill='#ddd6fe' stroke='#7c3aed'/>
    <rect x='440' y='392' width='140' height='46' rx='6' fill='#ede9fe' stroke='#7c3aed'/>
    <rect x='600' y='392' width='140' height='46' rx='6' fill='#ede9fe' stroke='#7c3aed'/>
    <rect x='760' y='392' width='140' height='46' rx='6' fill='#ede9fe' stroke='#7c3aed'/>
    <text x='420' y='472' font-size='13' fill='#475569'>grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) → 一行实现自适应卡片墙</text>
  </g>
</svg>